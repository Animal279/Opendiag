[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendiag"
dynamic = ["version"]
description = "Windows ECU diagnostic application reconstructed from OpenDiag migration documents"
readme = "README.md"
requires-python = ">=3.12.10,<3.13"
dependencies = [
  "PySide6==6.11.1",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pyserial==3.5",
  "cantools==42.0.1",
  "paramiko==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-qt==4.5.0", "pytest-cov==7.1.0"]
build = ["cx_Freeze==8.6.4"]

[project.gui-scripts]
opendiag = "src.app_setup:main"

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.package-data]
"src.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = ["integration: local socket and application integration checks"]
